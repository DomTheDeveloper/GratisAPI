<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GratisAPI — API Reference (Swagger UI)</title>
  <meta name="description" content="Interactive Swagger UI reference for GratisAPI, the completely free static open-data API." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🆓</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; background: #0d1117; }
    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 22px; background: #010409;
      border-bottom: 1px solid #30363d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .topbar a { color: #9198a1; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .topbar a:hover { color: #e6edf3; }
    .topbar .brand { color: #e6edf3; font-weight: 800; font-size: 1.1rem; margin-right: auto; }
    .topbar .brand span { color: #3fb950; }
    .topbar .badge {
      background: rgba(63,185,80,0.12); color: #3fb950;
      border: 1px solid rgba(63,185,80,0.35); padding: 2px 9px;
      border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    }
    #swagger-ui { max-width: 1160px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="../">Gratis<span>API</span></a>
    <span class="badge">100% Free</span>
    <a href="../">Home</a>
    <a href="../openapi.json">openapi.json</a>
    <a href="https://github.com/DomTheDeveloper/GratisAPI">GitHub</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "../openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        tryItOutEnabled: true,
        defaultModelsExpandDepth: -1,
        docExpansion: "list",
      });
    };
  </script>
</body>
</html>
